name: keepalive-supabase

# ================================================================
# Prévention de la mise en pause de Supabase (plan gratuit).
# ----------------------------------------------------------------
# Rôle unique : générer de l'activité sur la base toutes les 6 h, pour que
# le projet n'atteigne jamais le seuil d'inactivité (~7 jours) qui déclenche
# la pause. 4×/jour → résiste aux runs programmés que GitHub retarde/saute.
#
# L'AUTO-RÉVEIL (réveiller le projet s'il s'est quand même mis en pause) est
# géré ailleurs, côté Vercel : api/cron/purge.js, via la variable Vercel
# SUPABASE_ACCESS_TOKEN. Rien à configurer ici : URL + clé publique sont
# lues dans le code client (valeurs déjà publiques). Aucun secret GitHub.
# ================================================================

on:
  schedule:
    - cron: '7 */6 * * *'   # toutes les 6 h (minute 7 pour éviter la pointe :00)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Générer de l'activité sur Supabase (anti-pause)
        run: |
          # Pas de `set -e` : on gère le code retour de curl nous-mêmes.
          URL=$(grep -m1 "^export const SUPABASE_URL" js/supabase-client.js | sed -E "s/.*= '([^']+)'.*/\1/")
          KEY=$(grep -m1 "^export const SUPABASE_ANON_KEY" js/supabase-client.js | sed -E "s/.*= '([^']+)'.*/\1/")
          REF=$(echo "$URL" | sed -E 's#https://([^.]+)\..*#\1#')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Extraction URL/clé impossible depuis js/supabase-client.js"
            exit 1
          fi

          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            "$URL/rest/v1/cabinets?select=id&limit=1" -H "apikey: $KEY" 2>/dev/null || echo "000")
          echo "Lecture REST → HTTP $CODE"

          if [ "$CODE" = "200" ]; then
            echo "✅ Supabase actif, activité générée."
            exit 0
          fi
          # Pas d'échec rouge en boucle : si en pause, c'est le cron Vercel qui réveille.
          echo "::warning::Supabase ne répond pas (HTTP $CODE) — probablement en pause. Le cron Vercel quotidien le réveille (si SUPABASE_ACCESS_TOKEN est défini sur Vercel). Réveil manuel : https://supabase.com/dashboard/project/$REF"
          exit 0
